<style>

.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;background:var(--c)}
input[type=range]{vertical-align:middle}

, {"seq": 95, "t": 4.934, "actor": "P2", "state": "acquiring", "detail": "picked up fork 3", "fork": 3, "owner": 2}, {"seq": 96, "t": 4.934, "actor": "P2", "state": "eating", "detail": "has both forks"}, {"seq": 97, "t": 5.435, "actor": "P2", "state": "releasing", "detail": "put down fork 2", "fork": 2, "owner": null}, {"seq": 98, "t": 5.436, "actor": "P2", "state": "releasing", "detail": "put down fork 3", "fork": 3, "owner": null}, {"seq": 99, "t": 5.436, "actor": "P2", "state": "thinking", "detail": "finished all meals"}]};
const ev = DATA.events;
let i = 0, playing = false, timer = null, value = 0;
const state = {}, forks = {};
const $ = id => document.getElementById(id);
const PAL = ['#2f7de1','#d9822b','#8a52c8','#1f9d55','#c2427a','#4a9aa5'];
$('desc').textContent = DATA.description;
$('seek').max = ev.length;

function init(){
  for (const a of DATA.actors) state[a.id] = DATA.kind === 'rw' ? 'idle' : 'thinking';
  for (const f of DATA.forks) forks[f] = null;
  value = 0;
}
function apply(e){
  state[e.actor] = e.state;
  if ('fork' in e) forks[e.fork] = e.owner;
  if ('value' in e) value = e.value;
}
const card = a => `<div class="card st-${state[a.id]}"><b>${a.id}</b><span>${state[a.id]}</span></div>`;

function renderRW(){
  const rs = DATA.actors.filter(a => a.role === 'reader'), ws = DATA.actors.filter(a => a.role === 'writer');
  const reading = rs.filter(a => state[a.id] === 'reading').map(a => a.id);
  const writing = ws.filter(a => state[a.id] === 'writing').map(a => a.id);
  const waiting = DATA.actors.filter(a => state[a.id] === 'waiting').map(a => a.id);
  const status = writing.length ? 'EXCLUSIVE WRITE by ' + writing.join(', ')
               : reading.length ? 'SHARED READ by ' + reading.join(', ') : 'FREE';
  const cls = writing.length ? 'st-writing' : reading.length ? 'st-reading' : 'st-idle';
  $('stage').innerHTML =
    `<div class="row"><h3>Readers</h3>${rs.map(card).join('')}</div>
     <div class="resource ${cls}"><div class="small">Shared resource / critical section</div>
       <div class="big">${status}</div><div>stored value = ${value}</div></div>
     <div class="row"><h3>Writers</h3>${ws.map(card).join('')}</div>
     <div class="small">Waiting: ${waiting.join(', ') || 'none'}</div>`;
}
function renderDP(){
  const n = DATA.actors.length, cx = 210, cy = 210, R = 140, step = 360 / n;
  const pos = (deg, r) => [cx + r * Math.cos(deg * Math.PI / 180), cy + r * Math.sin(deg * Math.PI / 180)];
  let lines = '', dots = '', phs = '';
  DATA.actors.forEach((a, k) => {
    const [x, y] = pos(-90 + step * k, R);
    phs += `<g class="st-${state[a.id]}"><circle class="ph" cx="${x}" cy="${y}" r="36"/>
      <text x="${x}" y="${y - 2}">${a.id}</text><text class="sm" x="${x}" y="${y + 13}">${state[a.id]}</text></g>`;
  });
  DATA.forks.forEach(f => {
    const [fx, fy] = pos(-90 + step * f + step / 2, R);
    const o = forks[f];
    if (o !== null) {
      const [px, py] = pos(-90 + step * o, R);
      lines += `<line x1="${fx}" y1="${fy}" x2="${px}" y2="${py}" stroke="${PAL[o % 6]}" stroke-width="4"/>`;
    }
    dots += `<circle class="fk" cx="${fx}" cy="${fy}" r="14" fill="${o === null ? 'var(--free)' : PAL[o % 6]}"/>
      <text class="fl" x="${fx}" y="${fy + 3}">F${f}</text>`;
  });
  const owners = DATA.forks.map(f => `F${f}: ${forks[f] === null ? 'free' : 'held by P' + forks[f]}`).join(' | ');
  $('stage').innerHTML = `<svg class="dp" viewBox="0 0 420 420"><circle class="table" cx="${cx}" cy="${cy}" r="92"/>
    ${lines}${dots}${phs}</svg><div class="small" style="text-align:center">${owners}</div>`;
}
function render(){ DATA.kind === 'rw' ? renderRW() : renderDP(); $('seek').value = i; $('pos').textContent = i + ' / ' + ev.length + ' events'; }

function addLog(e){
  const d = document.createElement('div');
  d.textContent = `#${e.seq} t=${e.t.toFixed(3)}s  ${e.actor}  ${e.state}  ${e.detail}`;
  $('log').appendChild(d); $('log').scrollTop = $('log').scrollHeight;
}
function stepOnce(){ if (i >= ev.length) { pause(); return; } apply(ev[i]); addLog(ev[i]); i++; render(); }
function delay(){ return 1600 - Number($('speed').value); }
function loop(){ if (!playing) return; stepOnce(); if (i < ev.length) timer = setTimeout(loop, delay()); else pause(); }
function play(){ if (i >= ev.length) resetAll(); playing = true; $('play').textContent = 'Pause'; loop(); }
function pause(){ playing = false; clearTimeout(timer); $('play').textContent = 'Start'; }
function seekTo(n){ init(); $('log').innerHTML = ''; for (let k = 0; k < n; k++) { apply(ev[k]); addLog(ev[k]); } i = n; render(); }
function resetAll(){ pause(); seekTo(0); }

$('play').onclick = () => playing ? pause() : play();
$('step').onclick = () => { pause(); stepOnce(); };
$('reset').onclick = resetAll;
$('seek').oninput = e => { pause(); seekTo(Number(e.target.value)); };

const legendStates = DATA.kind === 'rw' ? ['idle','waiting','reading','writing'] : ['thinking','hungry','acquiring','eating','releasing'];
$('legend').innerHTML = legendStates.map(s => `<span class="st-${s}"><i></i>${s}</span>`).join('');
init(); render();
</script></body></html>
